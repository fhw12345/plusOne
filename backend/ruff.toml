line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "TCH",    # flake8-type-checking
    "PL",     # pylint
]
ignore = [
    "E501",     # line length handled by formatter
    "PLR0913",  # too many arguments — fine for fastapi handlers
    "S101",     # assert statements — fine in tests
]

[lint.per-file-ignores]
"tests/**" = ["S", "PLR2004", "B008", "TC003", "PLC0415"]   # security/magic-value/Depends-default/typing-imports/inline-imports off in tests
"alembic/**" = ["E", "F", "I", "N", "TC002"]   # autogenerated migrations + env loader
# Pydantic / SQLAlchemy models need their field types importable at runtime.
"src/plus_one/core/agents/framework/skills.py" = ["TC003"]
"src/plus_one/core/db/models.py" = ["TC003"]
"src/plus_one/agents/joiner.py" = ["TC001"]
# Fixture-backed tools use Path at runtime in __init__ defaults.
"src/plus_one/core/tools/**" = ["TC003"]
# OAuth2 "token_type" is a standard field name (RFC 6749 §5.1), not a password.
"src/plus_one/api/auth.py" = ["S105", "TC002"]
# FastAPI runtime types — same rationale as auth.py.
"src/plus_one/api/trips.py" = ["TC002", "TC003"]
"src/plus_one/services/trip_runner.py" = ["TC003"]
# FastAPI's Depends(...) needs runtime types for parameter resolution; AsyncSession
# can't live under TYPE_CHECKING here.
"src/plus_one/core/auth/deps.py" = ["TC002"]

[lint.isort]
known-first-party = ["plus_one"]

[format]
quote-style = "double"
indent-style = "space"
