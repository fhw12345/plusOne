[project]
name = "plus-one"
version = "0.1.0"
description = "AI travel planner — local gems vs tourist traps via cross-source agent cycle"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [
    { name = "Haowen Feng" },
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Config + validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # LLM — all traffic routed through Agent Maestro
    # (Anthropic-API-compatible gateway, multi-vendor: Claude / GPT / Gemini)
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",

    # DB
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Auth
    "fastapi-users[sqlalchemy]>=14.0.0",
    "python-jose[cryptography]>=3.3.0",

    # Cache / queue
    "redis>=5.2.0",

    # Scraping
    "playwright>=1.49.0",
    "praw>=7.8.0",
    "httpx>=0.28.0",

    # Observability
    "structlog>=24.4.0",
    "langfuse>=2.55.0",

    # Utilities
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "pre-commit>=4.0.0",
    "detect-secrets>=1.5.0",
    "types-python-jose>=3.3.4",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plus_one"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=plus_one",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "unit: fast, isolated unit tests",
    "integration: integration tests requiring docker-compose services",
    "eval: LLM evaluation tests (slow, costs tokens)",
]
