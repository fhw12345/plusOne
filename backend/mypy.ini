[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_return_any = True
warn_unreachable = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
check_untyped_defs = True
strict_equality = True
plugins = pydantic.mypy

# These overrides are activated lazily as the relevant libraries get imported.
# Mypy warns about "unused section" if the library is not yet imported anywhere;
# warn_unused_configs is set above so that warning surfaces only when truly stale.

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-praw]
ignore_missing_imports = True

[mypy-praw.*]
ignore_missing_imports = True
