name: CI
# Re-verified 2026-05-24: console-email-sender path + /api/auth/dev/last-code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # === Detect what changed to skip irrelevant jobs ===
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - '.pre-commit-config.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # === Backend ===
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plus_one
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: plus_one
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plus_one"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://plus_one:dev@localhost:5432/plus_one
      REDIS_URL: redis://localhost:6379/0
      # CI never calls a real LLM — see tests/conftest.py (MockLLMProvider)
      MAESTRO_BASE_URL: http://localhost:23333/api/anthropic
      MAESTRO_AUTH_TOKEN: dummy-for-ci
      JWT_SECRET: dummy-for-ci

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Typecheck (mypy)
        run: uv run mypy src

      - name: Unit tests
        run: uv run pytest tests/unit -m unit -v

      - name: Integration tests
        run: uv run pytest tests/integration -m integration -v
        if: false  # Enable when first integration test exists

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/htmlcov/
          retention-days: 7

  # === Frontend ===
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (prettier)
        run: pnpm format:check

      - name: Lint (eslint)
        run: pnpm lint

      - name: Typecheck (tsc)
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # === Frontend E2E (Playwright) ===
  frontend-e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plus_one
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: plus_one
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plus_one"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      CI: "true"
      # Backend env consumed by the uvicorn process started by Playwright's
      # webServer[1]. Pass via the runner env so the spawned child inherits.
      APP_ENV: development
      ALLOW_CONSOLE_EMAIL_SENDER: "true"
      AUTH_COOKIE_SECURE: "false"
      DATABASE_URL: postgresql+asyncpg://plus_one:dev@localhost:5432/plus_one
      REDIS_URL: redis://localhost:6379/0
      MAESTRO_BASE_URL: http://localhost:23333/api/anthropic
      MAESTRO_AUTH_TOKEN: dummy-for-ci
      JWT_SECRET: dummy-for-ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
          enable-cache: true

      - name: Set up Python
        working-directory: backend
        run: uv python install 3.12

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Apply DB migrations
        working-directory: backend
        run: uv run alembic upgrade head
        # Tolerate the case where alembic is not yet configured for this branch.
        continue-on-error: true

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # Key on the Playwright version itself, not the lockfile — avoids
          # invalidating the browser cache on unrelated dep bumps.
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build
        run: pnpm build

      - name: Run e2e
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

  # === Aggregate gate (required check on main) ===
  ci-pass:
    needs: [backend, frontend, frontend-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          if [ "${{ needs.backend.result }}" = "failure" ] || \
             [ "${{ needs.frontend.result }}" = "failure" ] || \
             [ "${{ needs.frontend-e2e.result }}" = "failure" ]; then
            echo "❌ A required job failed"
            exit 1
          fi
          echo "✅ All required jobs passed (or skipped)"
